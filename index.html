  const d = new Date(today); const day = d.getDay();
  const sat = new Date(d);
  if(day===0) sat.setDate(d.getDate()-1);        // 日曜のときは前日の土曜から
  else sat.setDate(d.getDate() + (6-day));       // 土曜までの日数
  const sun = new Date(sat); sun.setDate(sat.getDate()+1);
  return [sat, sun];
}
const [wsat, wsun] = weekendRange();
function dateTokens(e){
  // dateText から M/D・M月D日 を拾い、開催期間内の日付に直す（複数日開催の判定用）
  const t = e.dateText || ''; const out = [];
  const re = /(\d{1,2})[\/月](\d{1,2})日?/g; let m;
  const s = parseD(e.startDate), en = endOf(e);
  while((m = re.exec(t)) !== null){
    const mo=+m[1], da=+m[2];
    if(mo<1||mo>12||da<1||da>31) continue;
    let y = s ? s.getFullYear() : today.getFullYear();
    let cand = new Date(y, mo-1, da);
    if(s && cand < s && en && new Date(y+1, mo-1, da) <= en) cand = new Date(y+1, mo-1, da);
    out.push(cand);
  }
  return out;
}
function occursThisWeekend(e){
  if(isPast(e)) return false;
  const s = parseD(e.startDate), en = endOf(e);
  if(!s || !en) return false;
  const spanDays = (en - s) / 86400000;
  if(e.recurring){
    // 繰り返し開催は、本文中の開催日が今週末に当たるものだけ
    return dateTokens(e).some(d => sameDay(d, wsat) || sameDay(d, wsun));
  }
  if(spanDays > 13) return false; // 長期開催（展示など）は週末ピックに入れない
  return s <= wsun && en >= wsat;
}
function badges(e){
  let h='';
  if(isOngoing(e)) h+='<span class="badge now">開催中</span>';
  if(e.forPreschool) h+='<span class="badge pre">未就学児向け</span>';
  if(e.isSns) h+='<span class="badge sns">SNSで発見</span>';
  if(e.isFree) h+='<span class="badge free">無料</span>';
  if(e.needsApplication) h+='<span class="badge app">申込あり</span>';
  if(e.elementaryOnly) h+='<span class="badge">小学生向け</span>';
  return h;
}
function row(icon, text, clamp){
  return `<div class="row"><svg><use href="#${icon}"/></svg><span class="rowtext${clamp?' clamp2':''}">${text}</span></div>`;
}
function fmtDateText(t){
  // 「水曜日」→「水」、「14時30分」→「14:30」のように短く整える
  return (t||'')
    .replace(/([月火水木金土日])曜日/g, '$1')
    .replace(/(\d{1,2})時(\d{1,2})分/g, (m,h,mi)=> h + ':' + String(mi).padStart(2,'0'))
    .replace(/(\d{1,2})時(\d{2})(?!\d)/g, '$1:$2')
    .replace(/(\d{1,2})時(?=[〜～\s、,。）)]|$)/g, '$1:00');
}
function card(e){
  const s = parseD(e.startDate), en = endOf(e);
  let dateHtml;
  if(isOngoing(e) && en){
    dateHtml = `<div class="date"><div class="md small">開催中</div><div class="dow">〜${fmtD(en)}まで</div></div>`;
  } else if(s){
    dateHtml = `<div class="date"><div class="md">${fmtD(s)}</div><div class="dow">${WD[s.getDay()]}曜日</div></div>`;
  } else {
    dateHtml = '<div class="date"><div class="md">-</div></div>';
  }
  let m='';
  if(e.dateText) m+=row('i-cal', esc(fmtDateText(e.dateText)), true);
  if(e.venue) m+=row('i-pin', esc(e.venue) + (e.ward?'（'+esc(e.ward)+'）':''));
  else if(e.ward) m+=row('i-pin', esc(e.ward));
  if(e.feeText) m+=row('i-yen', esc(e.feeText));
  if(e.targetAge) m+=row('i-smile', esc(e.targetAge), true);
  if(e.needsApplication && e.applicationText) m+=row('i-clip', '申込：' + esc(e.applicationText));
  return `<div class="card${e.elementaryOnly?' dim':''}">${dateHtml}<div class="body">
    <div class="title">${esc(e.title)}</div><div class="badges">${badges(e)}</div>
    <div class="meta">${m}</div>
    <div class="src">情報元：<a href="${esc(e.sourceUrl||'#')}" target="_blank" rel="noopener">${esc(e.sourceName||'リンク')}</a></div>
  </div></div>`;
}
function sortKey(e){ return isOngoing(e) ? today.getTime() : (parseD(e.startDate) || new Date(9999,0,1)).getTime(); }
function byUpcoming(a,b){
  return (sortKey(a)-sortKey(b)) || ((b.forPreschool?1:0)-(a.forPreschool?1:0)) ||
         ((a.startDate||'') < (b.startDate||'') ? -1 : 1);
}
document.getElementById('headsub').textContent =
  `全${meta.total}件 ／ 最終更新 ${meta.refreshedJst}（毎朝自動更新）`;
const live = events.filter(e => !isPast(e));
const wk = live.filter(occursThisWeekend).sort((a,b)=>{
  const sa = parseD(a.startDate), sb = parseD(b.startDate);
  const ga = (sa && sa>=wsat && sa<=wsun) ? 0 : 1, gb = (sb && sb>=wsat && sb<=wsun) ? 0 : 1;
  return (ga-gb) || byUpcoming(a,b);
}).slice(0,12);
const wkEl = document.getElementById('weekend');
const wkMore = document.getElementById('wk-more');
let wkExpanded = false;
function renderWeekend(){
  const show = wkExpanded ? wk : wk.slice(0,3);
  wkEl.innerHTML = wk.length ? show.map(card).join('') : '<div class="empty">今週末の単発イベントは見つかりませんでした</div>';
  if(wk.length > 3){
    wkMore.style.display = 'block';
    wkMore.textContent = wkExpanded ? 'とじる' : `さらに表示（あと${wk.length-3}件）`;
  } else {
    wkMore.style.display = 'none';
  }
}
wkMore.addEventListener('click', ()=>{ wkExpanded = !wkExpanded; renderWeekend(); });
renderWeekend();
const wards = [...new Set(live.map(e=>e.ward).filter(Boolean))].sort();
const sel = document.getElementById('f-ward');
wards.forEach(w=>{ const o=document.createElement('option'); o.value=w; o.textContent=w; sel.appendChild(o); });
const state = {weekend:false, free:false, pre:false, sns:false, ward:'', kw:''};
function bindChip(id, key){
  const el=document.getElementById(id);
  el.addEventListener('click', ()=>{ state[key]=!state[key]; el.classList.toggle('on', state[key]); render(); });
}
bindChip('f-weekend','weekend'); bindChip('f-free','free'); bindChip('f-pre','pre'); bindChip('f-sns','sns');
sel.addEventListener('change', ()=>{ state.ward=sel.value; render(); });
document.getElementById('f-kw').addEventListener('input', ev=>{ state.kw=ev.target.value.trim(); render(); });
function render(){
  const list = live.filter(e=>{
    if(state.weekend && !occursThisWeekend(e)) return false;
    if(state.free && !e.isFree) return false;
    if(state.pre && !e.forPreschool) return false;
    if(state.sns && !e.isSns) return false;
    if(state.ward && e.ward!==state.ward) return false;
    if(state.kw && !((e.title||'')+(e.venue||'')+(e.targetAge||'')).includes(state.kw)) return false;
    return true;
  }).sort(byUpcoming);
  document.getElementById('list').innerHTML = list.map(card).join('');
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
}
render();
</script>
</body>
